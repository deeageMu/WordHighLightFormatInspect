name: Build Windows EXE (Nuitka, onefile)

on:
  workflow_dispatch:
  push:
    tags:
      - "nuitka-onefile-v*"

jobs:
  build-windows-onefile:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka

      - name: Build with Nuitka (onefile, MSVC)
        run: |
          python -m nuitka `
            --onefile `
            --file-version=1.0.0.0 `
            --product-version=1.0.0.0 `
            --onefile-tempdir-spec="%CACHE_DIR%/WordHighLightFormatInspect/%VERSION%" `
            --enable-plugin=tk-inter `
            --windows-console-mode=disable `
            --msvc=latest `
            --assume-yes-for-downloads `
            --output-dir=dist `
            --output-filename=WordHighLightFormatInspect.exe `
            main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordHighLightFormatInspect-windows-onefile
          path: dist/WordHighLightFormatInspect.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/nuitka-onefile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WordHighLightFormatInspect.exe
          generate_release_notes: true
